plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.30'
}

group = 'dev.dbzdoanything'
version = '0.5.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            property 'fml.earlyprogresswindow', 'false'
            property 'dmz.translations.enabled', 'false'
            property 'geckolib.disable_examples', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            args '--mixin.config', 'dbzdoanything.mixins.json'
            mods { dbzdoanything { source sourceSets.main } }
        }
        client {
            workingDirectory project.file(providers.gradleProperty('proofClientDirectory').getOrElse('run/client'))
            args '--username', providers.gradleProperty('proofUsername').getOrElse('AngelProof'), '--width', '960', '--height', '540'
            property 'dbzdoanything.proof.resources', 'true'
            property 'dbzdoanything.proof.lab', 'true'
        }
        server {
            workingDirectory project.file('run/server')
            args '--nogui'
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/'; content { includeGroup 'top.theillusivec4.curios' } }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('maven.modrinth:KzaFOUnM:GTkzwpju')
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.3')
    implementation fg.deobf('com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.10')
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
}

tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'dbzdoanything.mixins.json', 'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}

tasks.named('processResources', ProcessResources) {
    inputs.property('version', project.version)
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
